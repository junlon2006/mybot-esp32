name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install formatting tools
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format check
        run: |
          find main components/mybot_platform -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror {} +
      - name: Whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git diff --check "$range"
      - name: SPDX check
        run: |
          find main components/mybot_platform -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -print0 | while IFS= read -r -d '' file; do
              head -n 5 "$file" | grep -q 'SPDX-License-Identifier:' || {
                echo "missing SPDX header: $file" >&2
                exit 1
              }
            done
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git log --no-merges --format='%s' "$range" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | ./githooks/commit-msg --subject-only >/dev/null
          done

  idf-build:
    name: idf-5.5.2-${{ matrix.board }}-${{ matrix.language }}-ptime-${{ matrix.ptime }}
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: zhengchen-1.54tft-ml307
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: zhengchen-1.54tft-ml307
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: zhengchen-1.54tft-ml307
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: zhengchen-1.54tft-ml307
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: zhengchen-1.54tft-wifi
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: zhengchen-1.54tft-wifi
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: zhengchen-1.54tft-wifi
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: zhengchen-1.54tft-wifi
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: m5stack-core-s3
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: m5stack-core-s3
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: m5stack-stick-s3
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: m5stack-stick-s3
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: m5stack-stick-s3
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: m5stack-stick-s3
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: sensecap-watcher
            language: zh-CN
            ptime: 20
            defaults: ci/ptime20.defaults
          - board: sensecap-watcher
            language: zh-CN
            ptime: 40
            defaults: ci/ptime40.defaults
          - board: sensecap-watcher
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: sensecap-watcher
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          test "$(idf.py --version)" = "ESP-IDF v5.5.2"
      - name: Build ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          idf.py -B build-${{ matrix.board }}-ptime-${{ matrix.ptime }} \
            -DMYBOT_BOARD=${{ matrix.board }} \
            -DSDKCONFIG=build-${{ matrix.board }}-ptime-${{ matrix.ptime }}/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.defaults }}" \
            build
      - name: Report size
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          idf.py -B build-${{ matrix.board }}-ptime-${{ matrix.ptime }} size
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mybot-esp32-${{ matrix.board }}-${{ matrix.language }}-ptime-${{ matrix.ptime }}-${{ github.sha }}
          path: |
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}/mybot_esp32.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}/bootloader/bootloader.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}/partition_table/partition-table.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}/ota_data_initial.bin
